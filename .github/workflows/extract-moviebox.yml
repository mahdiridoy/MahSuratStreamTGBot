
name: Extract MovieBox TUI Bot

on:
  push:
    paths:
      - 'MovieBox-Tui-bot.zip'
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check ZIP File
        run: |
          if [ ! -f "MovieBox-Tui-bot.zip" ]; then
            echo "MovieBox-Tui-bot.zip not found!"
            exit 1
          fi

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o "MovieBox-Tui-bot.zip" -d extracted

          # Move extracted contents into repository root
          cp -a extracted/. .
          rm -rf extracted

      - name: Delete Original ZIP
        run: |
          rm -f "MovieBox-Tui-bot.zip"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract MovieBox-Tui-bot.zip and remove archive"
            git push
          fi
          
