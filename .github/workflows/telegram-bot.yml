name: Telegram Bot

on:
  workflow_dispatch:
  schedule:
    # restart every 6 hours (each run lives ~5h50m)
    - cron: "5 */6 * * *"

permissions:
  contents: read

# Never run two bots at once (Telegram long-polling allows only one).
concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "tgbot"
      - name: Build bot
        run: cargo build --profile bot --bin tgbot
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ vars.ALLOWED_CHAT_IDS }}
          RUN_MINUTES: "345"
        run: ./target/bot/tgbot
