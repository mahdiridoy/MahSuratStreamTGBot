
name: Transfer MovieBox Project to Root

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Verify Source
        run: |
          test -d MovieBox-Tui-main || {
            echo "Source folder not found!"
            exit 1
          }

          test -n "$(find MovieBox-Tui-main -mindepth 1 -print -quit)" || {
            echo "Source folder is empty!"
            exit 1
          }

      - name: Transfer All Files
        run: |
          cp -a MovieBox-Tui-main/. .
          rm -rf MovieBox-Tui-main

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: move MovieBox project to repository root"
          git push origin HEAD:main

      - name: Success
        run: echo "Project successfully transferred!"
        
