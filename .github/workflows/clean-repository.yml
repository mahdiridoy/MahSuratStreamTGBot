name: Auto Clean Full Repository

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to confirm full repository cleanup"
        required: true
        type: string

  schedule:
    - cron: "0 0 1 1 *"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "Confirmation failed. Cleanup cancelled."
            exit 1
          fi

      - name: Clean Entire Repository
        run: |
          echo "Cleaning repository..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          find .github -mindepth 1 \
            ! -path './.github/workflows' \
            -exec rm -rf {} + 2>/dev/null || true

          find .github/workflows -mindepth 1 \
            ! -name 'clean-repository.yml' \
            -exec rm -rf {} + 2>/dev/null || true

          echo "Repository cleanup completed."

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Repository is already clean."
          else
            git commit -m "chore: automatically clean entire repository"
            git push
          fi
          
