name: Run MahSurat Stream Bot

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'   # health check every 6 hours
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: |
          for f in bot.js web.js providers/*.js storage/*.js public/app.js; do
            node -c "$f" || { echo "❌ Syntax error in $f"; exit 1; }
          done
          echo "✅ Syntax OK"

      - name: Start bot + dashboard
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          WEB_URL: ${{ secrets.WEB_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          GITHUB_CALLBACK_URL: ${{ secrets.GITHUB_CALLBACK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run dev &
          BOT_PID=$!
          echo "Bot PID: $BOT_PID"
          # Keep the action alive while the bot runs (max 6 hours)
          sleep 21600
