name: Bot Release

# Builds the Telegram bot for Windows, Linux, Termux (Android) and publishes it as the
# rolling release "bot-latest", plus ready-to-use install scripts and a Scoop manifest.
on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "install-bot.sh"
      - "install-bot.ps1"
      - ".github/workflows/bot-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-release
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux_x64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            kind: cross
          - name: Linux_arm64
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            kind: cross
          - name: Android_arm64
            target: aarch64-linux-android
            os: ubuntu-latest
            kind: android
          - name: Windows_x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            kind: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "botrel-${{ matrix.target }}"

      - name: Install cross
        if: matrix.kind == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.kind == 'cross'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=65536"
        run: cross build --profile bot --locked --bin tgbot --target ${{ matrix.target }}

      - name: Setup Android NDK
        if: matrix.kind == 'android'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Build (Android)
        if: matrix.kind == 'android'
        run: |
          TOOLCHAIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TOOLCHAIN:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          cargo build --profile bot --locked --bin tgbot --target aarch64-linux-android

      - name: Build (Windows)
        if: matrix.kind == 'native'
        run: cargo build --profile bot --locked --bin tgbot --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/bot/tgbot dist/moviebox-tgbot
          tar -czf MovieBoxBot_${{ matrix.name }}.tar.gz -C dist .

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\bot\tgbot.exe" "dist\moviebox-tgbot.exe"
          Compress-Archive -Path dist\* -DestinationPath MovieBoxBot_${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bot-${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Publish bot-latest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare install scripts for this repository
        run: |
          mkdir -p out
          cp artifacts/* out/
          sed "s#__REPO__#${{ github.repository }}#g" install-bot.sh  > out/install-bot.sh
          sed "s#__REPO__#${{ github.repository }}#g" install-bot.ps1 > out/install-bot.ps1
          cd out && sha256sum MovieBoxBot_* > SHA256SUMS

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete bot-latest --yes --cleanup-tag --repo "$REPO" || true
          cat > notes.md << NOTES
          ## Install the Telegram bot on your own device (works with BDIX too)

          **Windows (PowerShell)**
          \`\`\`
          irm https://github.com/$REPO/releases/download/bot-latest/install-bot.ps1 | iex
          \`\`\`

          **Termux (Android)**
          \`\`\`
          pkg update && pkg install -y curl tar
          curl -fsSL https://github.com/$REPO/releases/download/bot-latest/install-bot.sh | bash
          \`\`\`

          **Linux**
          \`\`\`
          curl -fsSL https://github.com/$REPO/releases/download/bot-latest/install-bot.sh | bash
          \`\`\`

          **Scoop (Windows)**
          \`\`\`
          scoop bucket add moviebox-bot https://github.com/$REPO
          scoop install moviebox-tgbot
          \`\`\`

          Then run: \`moviebox-tgbot\` (it asks for your bot token once and remembers it).
          NOTES
          gh release create bot-latest out/* --repo "$REPO" --title "Telegram Bot (latest)" --notes-file notes.md --target "${{ github.sha }}"

      - name: Update Scoop manifest
        run: |
          HASH=$(sha256sum out/MovieBoxBot_Windows_x64.zip | awk '{print $1}')
          VER="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          mkdir -p bucket
          cat > bucket/moviebox-tgbot.json << JSON
          {
            "version": "$VER",
            "description": "MovieBox Telegram bot (search all providers, play in Telegram / MX Player / VLC)",
            "homepage": "https://github.com/${{ github.repository }}",
            "license": "MIT|Apache-2.0",
            "url": "https://github.com/${{ github.repository }}/releases/download/bot-latest/MovieBoxBot_Windows_x64.zip",
            "hash": "$HASH",
            "bin": "moviebox-tgbot.exe"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/moviebox-tgbot.json
          git commit -m "chore: update scoop manifest [skip ci]" || exit 0
          git push || true
